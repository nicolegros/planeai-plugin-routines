name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install pnpm
        run: npm install -g pnpm@10.28.2
      - run: pnpm install --frozen-lockfile
      - run: make test
      - run: make verify-package
      - run: make smoke
