name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: windows-x64
            runner: windows-latest
    name: validate (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install pnpm
        run: npm install -g pnpm@10.28.2
      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - run: pnpm install --frozen-lockfile
      - run: make lint
        if: runner.os == 'Linux'
      - run: make test
      - run: make verify-package
      - run: make smoke
