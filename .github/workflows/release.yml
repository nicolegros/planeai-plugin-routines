name: Release plugin

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm@10.28.2
      - run: pnpm install --frozen-lockfile
      - name: Determine the next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # A failing auto fails the release; an empty bump means nothing to release.
          bump=$(pnpm exec auto version | tail -n 1)
          case "$bump" in
            major | minor | patch) ;;
            "")
              echo "No release-worthy change since the last release"
              exit 0
              ;;
            *)
              echo "auto version printed an unexpected bump: $bump" >&2
              exit 1
              ;;
          esac
          current=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
          IFS=. read -r major minor patch <<< "${current#v}"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Each platform builds, checks and smoke-tests its own binary natively before anything is published.
  build:
    needs: version
    if: needs.version.outputs.tag != ''
    strategy:
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install pnpm
        run: npm install -g pnpm@10.28.2
      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - run: pnpm install --frozen-lockfile
      - run: make test
      - name: Inject version
        run: node scripts/inject-release-version.mjs ${{ needs.version.outputs.tag }}
      - name: Verify the package declares and answers the release version
        run: make verify-package
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.tag }}
      - run: make smoke
      - name: Archive
        run: |
          set -euo pipefail
          mkdir -p artifacts
          name="planeai-plugin-routines-${{ matrix.platform }}"
          if [ "${{ matrix.platform }}" = windows-x64 ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path dist/planeai-plugin-routines -DestinationPath artifacts/$name.zip"
          else
            tar -C dist -czf "artifacts/$name.tar.gz" planeai-plugin-routines
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  # Runs only when every platform passed, so a failed build leaves no tag and no release behind.
  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: artifacts
      - name: Tag and publish the release
        run: |
          gh release create "${{ needs.version.outputs.tag }}" artifacts/* \
            --target "${{ github.sha }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
