name: Release plugin

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install pnpm
        run: npm install -g pnpm@10.28.2
      - run: pnpm install --frozen-lockfile
      - run: make test
      - run: make verify-package
      - name: Check version
        id: version
        run: |
          echo "--- auto version raw output ---"
          pnpm exec auto version 2>&1 | tee /tmp/auto-output.txt || true
          echo "--- end raw output ---"
          VERSION=$(tail -1 /tmp/auto-output.txt)
          echo "Parsed VERSION=$VERSION"
          if [[ "$VERSION" == "patch" || "$VERSION" == "minor" || "$VERSION" == "major" ]]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No valid version bump detected, skipping release"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: gate
    if: needs.gate.outputs.version != ''
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Determine new version
        id: tag
        shell: bash
        run: |
          BUMP="${{ needs.gate.outputs.version }}"
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT="${CURRENT#v}"
          IFS='.' read -r major minor patch <<< "$CURRENT"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
      - name: Create tag
        run: |
          git tag ${{ steps.tag.outputs.tag }}
          git push origin ${{ steps.tag.outputs.tag }}
      - name: Create draft release
        run: |
          gh release create ${{ steps.tag.outputs.tag }} \
            --draft \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    environment: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install pnpm
        run: npm install -g pnpm@10.28.2
      - run: pnpm install --frozen-lockfile
      - run: make test
      - name: Inject version
        run: node scripts/inject-release-version.mjs ${{ needs.release.outputs.tag }}
      - run: make build-ui
      # Bun cross-compiles, so one runner produces every platform's self-contained sidecar.
      - name: Stage and archive packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for spec in macos-arm64:bun-darwin-arm64:planeai-plugin-routines \
                      linux-x64:bun-linux-x64:planeai-plugin-routines \
                      windows-x64:bun-windows-x64:planeai-plugin-routines.exe; do
            IFS=: read -r platform target binary <<< "$spec"
            root="dist/$platform/planeai-plugin-routines"
            mkdir -p "$root/bin/$platform" "$root/ui"
            node scripts/stage-manifest.mjs "$platform" > "$root/planeai-plugin.json"
            cp build/ui/*.js "$root/ui/"
            bun build --compile --minify --target="$target" src/main.ts --outfile "$root/bin/$platform/$binary"
            chmod +x "$root/bin/$platform/$binary"
            if [ "$platform" = linux-x64 ]; then node scripts/verify-package-handshake.mjs "$root" "$platform"; fi
            if [ "$platform" = windows-x64 ]; then
              (cd "dist/$platform" && zip -qr "../../artifacts/planeai-plugin-routines-$platform.zip" planeai-plugin-routines)
            else
              tar -C "dist/$platform" -czf "artifacts/planeai-plugin-routines-$platform.tar.gz" planeai-plugin-routines
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: planeai-plugin-routines
          path: artifacts/*

  publish:
    needs: [release, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Upload release assets
        shell: bash
        run: find artifacts -type f -print0 | xargs -0 gh release upload "${{ needs.release.outputs.tag }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Publish release
        run: gh release edit "${{ needs.release.outputs.tag }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
